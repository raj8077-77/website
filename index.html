    :root {

      --card: #12101a;
      --line: rgba(168, 85, 247, 0.28);
      --purple: #c084fc;
      --purple-deep: #7c3aed;
      --gold: #e4c56a;

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: 40px 1fr 40px;
      align-items: center;
      gap: 8px;
      padding: calc(6px + env(safe-area-inset-top)) 12px 6px;
      background: rgba(7, 6, 12, 0.78);
      backdrop-filter: blur(16px);

      height: 36px;
      border-radius: 10px;

      object-position: center;
      background: #000;

      color: #fff;
      text-shadow: 0 1px 6px #000;

      border-radius: 10px;

      background: rgba(124, 58, 237, 0.16);
      color: var(--gold);

    .profile {

      overflow: hidden;
      background: linear-gradient(180deg, rgba(124, 58, 237, 0.16), rgba(18, 16, 26, 0.92));

      border-radius: 22px;
      padding: 22px 16px 18px;

    .raid { position: fixed; inset: 0; z-index: 90; pointer-events: none; }
    .dim { position: absolute; inset: 0; background: rgba(0,0,0,.62); opacity: 0; transition: opacity .35s; }
    .raid.on .dim { opacity: 1; }
    .lights { position: absolute; inset: 0; opacity: 0; }
    .lights span { position: absolute; inset: 0; }
    .lights .red { background: radial-gradient(circle at 12% 42%, rgba(255,24,24,.85), transparent 48%); }
    .lights .blue { background: radial-gradient(circle at 88% 42%, rgba(36,92,255,.85), transparent 48%); }

    .lights.on .blue { animation: sirenB .36s steps(1) infinite; }

    @keyframes sirenB { 0%, 49% { opacity: .08; } 50%, 100% { opacity: 1; } }

    .lane.b { transform: rotate(28deg); }
    .strip {

      border-top: 9px solid #111;
      border-bottom: 9px solid #111;
      transition: width 1.7s cubic-bezier(.16,.72,.18,1);
      box-shadow: 0 8px 16px rgba(0,0,0,.4);

    .lane.a .strip { left: 0; }
    .lane.b .strip { right: 0; }

    .roll {

      transition: left 1.7s cubic-bezier(.16,.72,.18,1), right 1.7s cubic-bezier(.16,.72,.18,1), transform 1.7s linear;
    }
    .lane.a .roll { left: 0; }
    .lane.b .roll { right: 0; }
    .lane.a.out .roll { left: calc(148vw - 56px); transform: rotate(640deg); }
    .lane.b.out .roll { right: calc(148vw - 56px); transform: rotate(-640deg); }
    .officer {
      position: absolute; left: 50%; bottom: -8vh; height: 94vh; width: auto; max-width: 96vw;
      object-fit: contain; object-position: center bottom; z-index: 4;

    .desc {

    .socials {

    .socials a {

    .picker-wrap {

    .num-box.open::after { transform: translateY(-20%) rotate(225deg); }

    .menu {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      min-width: 220px;
      background: #100e16;
      border: 1px solid rgba(228, 197, 106, 0.35);
      border-radius: 14px;
      padding: 6px;

    .menu.open { display: block; }

    .menu button {
      width: 100%;
      text-align: left;

      background: transparent;
      color: #fff;
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      font-size: 0.92rem;

    .menu button span {

      margin-right: 8px;
      font-weight: 700;
    }

    .menu button.active,
    .menu button:active {
      background: rgba(124, 58, 237, 0.28);

    .stage {
      overflow: hidden;
      touch-action: pan-y;
      padding: 8px 0 4px;
    }

    .track {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      transition: transform 0.52s cubic-bezier(0.22, 0.8, 0.28, 1);
      will-change: transform;

    .slot {
      flex: 0 0 46%;
      min-width: 0;
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 18px;
      overflow: hidden;
      opacity: 0.32;
      transform: scale(0.9);
      transform-origin: center bottom;
      transition: opacity 0.52s ease, transform 0.52s cubic-bezier(0.22, 0.8, 0.28, 1), border-color 0.52s ease, box-shadow 0.52s ease;

      color: inherit;
      text-align: left;
      padding: 0;
    }

    .slot.main {
      opacity: 1;
      transform: scale(1);
      border-color: rgba(228, 197, 106, 0.4);
      box-shadow: 0 12px 30px rgba(124, 58, 237, 0.22);

    .slot img {
      width: 100%;
      aspect-ratio: 1 / 1.15;
      object-fit: contain;
      object-position: center;
      background: #000;
      display: block;

    .slot .meta { padding: 10px 8px 12px; text-align: center; }

    .yp {
      --p: #7c3aed;
      --p2: #c4b5fd;
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      touch-action: manipulation;
      color: #fff;
    }

    .yp:fullscreen, .yp:-webkit-full-screen, .yp.force-land {
      width: 100%;
      height: 100%;
      max-width: none;
      border-radius: 0;
      aspect-ratio: auto;
    }
    .yp.force-land {
      position: fixed;
      z-index: 80;
      width: 100vh;
      height: 100vw;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(90deg);

    .yp-stage { position: absolute; inset: 0; overflow: hidden; background: #000; }
    .yp #ypYt, .yp #ypYt iframe { position: absolute; border: 0; pointer-events: none; }
    .yp #ypYt { left: 0; width: 100%; top: -42px; height: calc(100% + 84px); }
    .yp #ypYt iframe { width: 100%; height: 100%; }
    .yp-veil-top, .yp-veil-bot { position: absolute; left: 0; right: 0; z-index: 2; pointer-events: none; background: #000; }
    .yp-veil-top { top: 0; height: 28px; }
    .yp-veil-bot { bottom: 0; height: 34px; }
    .yp-hit { position: absolute; inset: 0; z-index: 3; }
    .yp-flash, .yp-meter { position: absolute; z-index: 6; display: none; pointer-events: none; }

    .yp-meter i { display: block; width: 100%; border-radius: 99px; background: var(--p2); }

    .yp-end { background: #000; padding: 0; border: 0; cursor: pointer; }

    .slot { position: relative; }

    .channels span { display: block; color: var(--muted); font-size: .78rem; }
    .channels a {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.03);
    }
    .channels svg { width: 22px; height: 22px; flex: 0 0 auto; }
    .channels b { display: block; font-size: .92rem; }
    .notice {

      .slot, .slot.main { opacity: 1; transform: none; flex: none; }
      .lane.x { display: block; }

    }

    });
    document.getElementById("ypBritfill").style.height = "100%";
    document.getElementById("ypVolfill").style.height = "100%";
    document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
    document.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
    if (screen.orientation && screen.orientation.lock) screen.orientation.lock("portrait").catch(function () {});
  </script>
</body>
