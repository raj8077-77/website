<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>D3.M0.N.IN player</title>
  <style>
    :root { --p: #7c3aed; --p2: #c4b5fd; --ink: #07070b; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--ink); color: #fff; font-family: system-ui, sans-serif; }
    main { max-width: 980px; margin: 0 auto; padding: 22px 14px 40px; }
    h1 { margin: 0; font-size: 22px; font-weight: 720; letter-spacing: .03em; }
    h1 span { color: var(--p2); }
    .lead { color: #aaa7b8; margin: 8px 0 16px; line-height: 1.45; }
    .shell {
      position: relative; width: 100%; aspect-ratio: 16/9; background: #000;
      border-radius: 16px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }
    .shell:fullscreen, .shell:-webkit-full-screen { border-radius: 0; width: 100%; height: 100%; aspect-ratio: auto; }
    .crop { position: absolute; inset: -72px 0; pointer-events: none; }
    .crop iframe { width: 100%; height: 100%; border: 0; }
    .hit { position: absolute; inset: 0; z-index: 2; }
    .chrome {
      position: absolute; inset: 0; z-index: 3; pointer-events: none;
      opacity: 1; transition: opacity .28s ease;
    }
    .chrome.hide { opacity: 0; }
    .chrome button, .chrome input { pointer-events: auto; }
    .logo {
      position: absolute; top: 14px; left: 14px; font-weight: 760; letter-spacing: .04em;
      text-shadow: 0 2px 10px rgba(0,0,0,.7); font-size: 16px;
    }
    .logo b { color: var(--p2); font-weight: 760; }
    .flash {
      position: absolute; top: 42%; z-index: 4; padding: 8px 12px; border-radius: 999px;
      background: rgba(124,58,237,.88); font-weight: 720; opacity: 0; pointer-events: none;
    }
    .flash.l { left: 16px; } .flash.r { right: 16px; }
    .flash.show { animation: pop .55s ease; }
    @keyframes pop { 0% { opacity: 0; } 25% { opacity: 1; } 100% { opacity: 0; } }
    .poster, .end {
      position: absolute; inset: 0; z-index: 5; display: grid; place-items: center;
      background: #000 center/cover no-repeat;
    }
    .poster.off, .end.off { display: none; }
    .end { background-color: rgba(0,0,0,.78); text-align: center; gap: 12px; }
    .play {
      width: 78px; height: 78px; border: 0; border-radius: 50%; color: #fff; font-size: 28px; cursor: pointer;
      background: linear-gradient(180deg, #8b5cf6, var(--p));
      box-shadow: 0 12px 30px rgba(124,58,237,.5);
    }
    .bar {
      position: absolute; left: 0; right: 0; bottom: 0; display: grid; gap: 6px;
      padding: 28px 12px 12px;
      background: linear-gradient(transparent, rgba(0,0,0,.82));
    }
    .seek { width: 100%; accent-color: var(--p); height: 18px; }
    .row { display: flex; align-items: center; gap: 8px; }
    .row button, .vol {
      color: #fff; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px; padding: 7px 10px; cursor: pointer; font: inherit;
    }
    .time { font-variant-numeric: tabular-nums; font-size: 13px; min-width: 84px; }
    .vol { width: 84px; accent-color: var(--p); }
    .spacer { flex: 1; }
    .note { color: #aaa7b8; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>D3M0N.<span>IN</span></h1>
    <p class="lead">Big Buck Bunny is loaded. Controls hide on their own. Tap the picture to bring them back. Double-tap left or right to skip.</p>
    <div class="shell" id="shell">
      <div class="crop" id="crop"></div>
      <div class="hit" id="hit"></div>
      <div class="flash l" id="flashL">-10</div>
      <div class="flash r" id="flashR">+10</div>
      <div class="chrome" id="chrome">
        <div class="logo">D3.M0.N.<b>IN</b></div>
        <div class="bar">
          <input class="seek" id="seek" type="range" min="0" max="1000" value="0">
          <div class="row">
            <button id="toggle" type="button">Play</button>
            <span class="time" id="time">0:00 / 0:00</span>
            <button id="mute" type="button">Mute</button>
            <input class="vol" id="vol" type="range" min="0" max="100" value="100">
            <button id="rate" type="button">1×</button>
            <span class="spacer"></span>
            <button id="full" type="button">Full</button>
          </div>
        </div>
      </div>
      <div class="poster" id="poster">
        <button class="play" id="start" type="button">▶</button>
      </div>
      <div class="end off" id="end">
        <div class="logo" style="position:static">D3.M0.N.<b>IN</b></div>
        <button class="play" id="replay" type="button">▶</button>
      </div>
    </div>
    <p class="note">Open this over https, not as a downloaded file.</p>
  </main>
  <script>
    var VIDEO = "aqz-KE-bpKQ";
    var player = null, hideTimer = null, rates = [1, 1.25, 1.5, 2], rateAt = 0, lastTap = 0;

    function clock(n) {
      n = Math.max(0, Math.floor(n || 0));
      return Math.floor(n / 60) + ":" + String(n % 60).padStart(2, "0");
    }
    function showChrome() {
      document.getElementById("chrome").classList.remove("hide");
      clearTimeout(hideTimer);
      if (player && player.getPlayerState && player.getPlayerState() === 1) {
        hideTimer = setTimeout(function () { document.getElementById("chrome").classList.add("hide"); }, 2600);
      }
    }
    function paint() {
      if (!player || !player.getDuration) return;
      var d = player.getDuration() || 0, c = player.getCurrentTime() || 0;
      if (d) document.getElementById("seek").value = Math.floor((c / d) * 1000);
      document.getElementById("time").textContent = clock(c) + " / " + clock(d);
      document.getElementById("toggle").textContent = player.getPlayerState() === 1 ? "Pause" : "Play";
    }
    function boot() {
      player = new YT.Player("crop", {
        videoId: VIDEO,
        host: "https://www.youtube-nocookie.com",
        width: "100%",
        height: "100%",
        playerVars: {
          autoplay: 1, controls: 0, rel: 0, iv_load_policy: 3,
          disablekb: 1, playsinline: 1, fs: 0, origin: location.origin
        },
        events: {
          onReady: function () {
            var frame = document.querySelector("#crop iframe");
            if (frame) frame.referrerPolicy = "strict-origin-when-cross-origin";
            player.playVideo();
            document.getElementById("poster").classList.add("off");
            showChrome();
          },
          onStateChange: function (e) {
            paint();
            if (e.data === 1) showChrome();
            if (e.data === 2) document.getElementById("chrome").classList.remove("hide");
            document.getElementById("end").classList.toggle("off", e.data !== 0);
          },
          onError: function (e) {
            document.getElementById("time").textContent = "Error " + e.data;
          }
        }
      });
      setInterval(paint, 400);
    }
    function ensure() {
      if (player) return;
      if (window.YT && YT.Player) boot();
      else {
        window.onYouTubeIframeAPIReady = boot;
        var s = document.createElement("script");
        s.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(s);
      }
    }
    function jump(delta) {
      if (!player) return;
      var next = Math.max(0, (player.getCurrentTime() || 0) + delta);
      player.seekTo(next, true);
      var el = document.getElementById(delta < 0 ? "flashL" : "flashR");
      el.classList.remove("show"); void el.offsetWidth; el.classList.add("show");
      showChrome();
    }
    document.getElementById("poster").style.backgroundImage = "url(https://i.ytimg.com/vi/" + VIDEO + "/hqdefault.jpg)";
    document.getElementById("start").onclick = ensure;
    document.getElementById("replay").onclick = function () {
      document.getElementById("end").classList.add("off");
      player.seekTo(0, true); player.playVideo();
    };
    document.getElementById("toggle").onclick = function () {
      if (!player) return ensure();
      player.getPlayerState() === 1 ? player.pauseVideo() : player.playVideo();
      showChrome();
    };
    document.getElementById("mute").onclick = function () {
      if (!player) return;
      player.isMuted() ? player.unMute() : player.mute();
      this.textContent = player.isMuted() ? "Sound" : "Mute";
      showChrome();
    };
    document.getElementById("vol").oninput = function () {
      if (!player) return;
      player.setVolume(Number(this.value));
      if (Number(this.value) === 0) player.mute(); else player.unMute();
      showChrome();
    };
    document.getElementById("seek").oninput = function () {
      if (!player || !player.getDuration()) return;
      player.seekTo((this.value / 1000) * player.getDuration(), true);
      showChrome();
    };
    document.getElementById("rate").onclick = function () {
      if (!player) return;
      rateAt = (rateAt + 1) % rates.length;
      player.setPlaybackRate(rates[rateAt]);
      this.textContent = rates[rateAt] + "×";
      showChrome();
    };
    document.getElementById("full").onclick = function () {
      var el = document.getElementById("shell");
      if (document.fullscreenElement) document.exitFullscreen();
      else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
      showChrome();
    };
    document.getElementById("hit").addEventListener("click", function (e) {
      var now = Date.now();
      var box = this.getBoundingClientRect();
      var left = e.clientX - box.left < box.width / 2;
      if (now - lastTap < 280 && player) jump(left ? -10 : 10);
      else showChrome();
      lastTap = now;
    });
    document.getElementById("shell").addEventListener("mousemove", showChrome);
  </script>
</body>
</html>
