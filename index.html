<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Fixed custom YouTube player</title>
  <style>
    :root { --accent: #d4a853; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0e0e12; color: #f6f3ec; font-family: system-ui, sans-serif; }
    main { max-width: 900px; margin: 0 auto; padding: 24px 16px 40px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #9c978e; line-height: 1.45; }
    form { display: flex; gap: 8px; margin: 12px 0 16px; }
    input[type="text"] { flex: 1; font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid #2c2c34; background: #17171d; color: #fff; }
    button { font: inherit; background: var(--accent); color: #1b1408; border: 0; border-radius: 8px; padding: 10px 14px; cursor: pointer; }
    .player { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; }
    .crop { position: absolute; inset: -60px 0; }
    .crop iframe { width: 100%; height: 100%; border: 0; }
    .cover { position: absolute; inset: 0; display: grid; place-items: center; background: #000 center/cover no-repeat; z-index: 2; }
    .cover.hide { display: none; }
    .end { background: rgba(0,0,0,.84); text-align: center; padding: 16px; gap: 10px; }
    #log { font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>Custom player, Error 153 fixed</h1>
    <p>Paste a YouTube link, press Load, then Play. This page must be opened over http or https, not as a file.</p>
    <form id="form">
      <input id="video" type="text" value="https://www.youtube.com/watch?v=aqz-KE-bpKQ">
      <button type="submit">Load</button>
    </form>
    <div class="player" id="player">
      <div class="crop" id="crop"></div>
      <div class="cover" id="facade"><button id="play" type="button">Play</button></div>
      <div class="cover end hide" id="ended">
        <p>Yeh tumhara end card hai.</p>
        <button id="replay" type="button">Replay</button>
      </div>
    </div>
    <p id="log">Waiting.</p>
  </main>
  <script>
    var current = "aqz-KE-bpKQ";
    var frame = null;

    function parseId(raw) {
      raw = (raw || "").trim();
      if (/^[\w-]{11}$/.test(raw)) return raw;
      try {
        var u = new URL(raw);
        if (u.hostname === "youtu.be") return u.pathname.slice(1, 12);
        if (u.searchParams.get("v")) return u.searchParams.get("v");
        var parts = u.pathname.split("/");
        var e = parts.indexOf("embed");
        if (e !== -1) return parts[e + 1];
        var s = parts.indexOf("shorts");
        if (s !== -1) return parts[s + 1];
      } catch (err) {}
      return "";
    }

    function log(text) { document.getElementById("log").textContent = text; }

    function poster(id) {
      document.getElementById("facade").style.backgroundImage = "url(https://i.ytimg.com/vi/" + id + "/hqdefault.jpg)";
    }

    function srcFor(id) {
      var q = new URLSearchParams({
        autoplay: "1",
        controls: "0",
        rel: "0",
        iv_load_policy: "3",
        playsinline: "1",
        enablejsapi: "1",
        origin: location.origin
      });
      return "https://www.youtube-nocookie.com/embed/" + id + "?" + q.toString();
    }

    function mount(id) {
      current = id;
      poster(id);
      document.getElementById("ended").classList.add("hide");
      document.getElementById("facade").classList.remove("hide");
      document.getElementById("crop").innerHTML = "";
      frame = document.createElement("iframe");
      frame.title = "YouTube player";
      frame.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
      frame.allowFullscreen = true;
      frame.referrerPolicy = "strict-origin-when-cross-origin";
      frame.src = srcFor(id);
      document.getElementById("crop").appendChild(frame);
      log("Loaded " + id + " from origin " + location.origin + ". Press Play.");
    }

    document.getElementById("form").onsubmit = function (e) {
      e.preventDefault();
      var id = parseId(document.getElementById("video").value);
      if (!id) return log("Link se video id nahi nikli.");
      mount(id);
    };

    document.getElementById("play").onclick = function () {
      if (!frame) mount(current);
      document.getElementById("facade").classList.add("hide");
      frame.src = srcFor(current);
      log("Play sent. If the black box stays on Error 153, this page has no http origin.");
    };

    document.getElementById("replay").onclick = function () {
      frame.src = srcFor(current);
      document.getElementById("ended").classList.add("hide");
    };

    window.addEventListener("message", function (event) {
      if (!event.origin.includes("youtube")) return;
      var data = event.data;
      if (typeof data === "string") {
        try { data = JSON.parse(data); } catch (e) { return; }
      }
      if (data && data.event === "onStateChange" && data.info === 0) {
        document.getElementById("ended").classList.remove("hide");
      }
      if (data && data.event === "onError") log("YouTube error " + data.info);
    });

    if (location.protocol === "file:") {
      log("file:// se nahi chalega. python3 -m http.server chalao, phir http://localhost:8000 se kholo.");
    } else {
      poster(current);
      log("Ready on " + location.origin);
    }
  </script>
</body>
</html>
