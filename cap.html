const crc=u=>{let c=~0;for(let i=0;i<u.length;i++)c=crcT[(c^u[i])&255]^(c>>>8);return~c>>>0};
function zip(F){const enc=new TextEncoder(),P=[],Cd=[];let off=0;F.forEach(f=>{const nm=enc.encode(f.n),h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint32(14,f.crc,true);h.setUint32(18,f.size,true);h.setUint32(22,f.size,true);h.setUint16(26,nm.length,true);P.push(h.buffer,nm,f.b);
const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint32(16,f.crc,true);c.setUint32(20,f.size,true);c.setUint32(24,f.size,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);Cd.push(c.buffer,nm);off+=30+nm.length+f.size});
const cl=Cd.reduce((a,b)=>a+b.byteLength,0),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,F.length,true);e.setUint16(10,F.length,true);e.setUint32(12,cl,true);e.setUint32(16,off,true);return new Blob([...P,...Cd,e.buffer],{type:'application/zip'})}
async function expZip(){const[W,H]=dims(S.rs),fps=S.fp,cv=document.createElement('canvas');cv.width=W;cv.height=H;const cx=cv.getContext('2d'),N=Math.ceil(total*fps),F=[];
for(let i=0;i<N;i++){if(vidUrl){const v=$('vid');await new Promise(res=>{const target=Math.max(0,Math.min(i/fps,(v.duration||i/fps+1)-.04));if(Math.abs(v.currentTime-target)<.04)return res();const done=()=>{clearTimeout(tm);v.removeEventListener('seeked',done);res()};const tm=setTimeout(done,700);v.addEventListener('seeked',done);try{v.currentTime=target}catch(e){done()}})}draw(cx,W,H,i/fps);const b=await new Promise((r,j)=>cv.toBlob(x=>x?r(x):j(new Error('Frame encode failed')),'image/png')),u=new Uint8Array(await b.arrayBuffer());F.push({n:'f'+String(i+1).padStart(5,'0')+'.png',b,size:b.size,crc:crc(u)});if(i%4===0){bar(i/N);out('Frame '+(i+1)+' / '+N);await new Promise(r=>setTimeout(r))}}
out('Building zip...');bar(1);out(await save('caption-frames-'+W+'x'+H+'-'+fps+'fps.zip',zip(F)))}

const FORMAT_PROMPT = `You are writing a caption script for Caption by d3m0n.in.
Transcribe the attached video word for word. Do not rewrite, shorten, polish, summarise, translate, or fix grammar. Keep the speaker's exact words, fillers, repeats, and false starts.
Output only the script. No title, no notes, no code fence, nothing before it, nothing after it.
One spoken block per line:
MM:SS - MM:SS: exact words
Marking rules, strict:
- Find the one punch line: the sentence where the point, joke, or turn lands. Only that line gets special marking.
- On that punch line, find the one punching word: the single word the line turns on. Wrap only that word in ^carets^. It is drawn largest. Never mark more than one ^word^ in the whole script.
- On that same punch line, wrap the short phrase that should change colour in _underscores_. One phrase only. Do not highlight any other line.
- Use *asterisks* only for one name or product, and not on the punching word.
- Other lines stay plain.
- Separate on-screen caption cuts inside a line with |
- Timestamps must match the video. Use MM:SS, or HH:MM:SS past one hour.
- End a line with [?] or [2] only when that mark is spoken or shown. Do not invent icons.
- Do not wrap lines in quotation marks. Do not add labels, bullets, or a leading asterisk.`;
function copyPrompt(){const done=()=>msg('Format prompt copied');if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(FORMAT_PROMPT).then(done,()=>fallback());else fallback();function fallback(){const ta=document.createElement('textarea');ta.value=FORMAT_PROMPT;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){msg('Copy failed')}ta.remove()}}
function fmtT(t){t=Math.max(0,t);const m=Math.floor(t/60),s=Math.floor(t%60);return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function writeTimes(){let i=0;SRC=SRC.split('\n').map(l=>{if(!/(\d+):(\d{2}).*[-–—].*(\d+):(\d{2})/.test(l))return l;const g=segs[i++];if(!g)return l;return l.replace(/(\d+:\d{2}(?::\d{2})?)\s*[-–—]+\s*(\d+:\d{2}(?::\d{2})?)/,fmtT(g.s)+' - '+fmtT(g.e))}).join('\n');HOLD=segs.map(g=>{const d=Math.max(.001,g.e-g.s);return g.ch.map(c=>(c.e-c.s)/d)})}
let drag=null;
function applyDrag(clientX){const base=drag.base,oldEnd=base[drag.si].ch[drag.ci].e,start=base[drag.si].ch[drag.ci].s,delta=Math.max(start+.2,oldEnd+(clientX-drag.x)/pps)-oldEnd;
segs.forEach((g,si)=>g.ch.forEach((c,ci)=>{const b=base[si].ch[ci];if(si===drag.si&&ci===drag.ci){c.s=b.s;c.e=b.e+delta}else if(S.ripple&&b.s>=oldEnd-.001){c.s=b.s+delta;c.e=b.e+delta}else{c.s=b.s;c.e=b.e}}));
segs.forEach(g=>{g.s=g.ch[0].s;g.e=g.ch[g.ch.length-1].e});total=Math.max(...segs.map(s=>s.e));
document.querySelectorAll('.cut').forEach(el=>{const c=segs[+el.dataset.si].ch[+el.dataset.ci];el.style.left=c.s*pps+'px';el.style.width=Math.max(8,(c.e-c.s)*pps-2)+'px'});
$('tlin').style.width=total*pps+'px';redraw(true);msg(fmtT(segs[drag.si].ch[drag.ci].e))}
$('tlin').addEventListener('pointerdown',e=>{const hd=e.target.closest('.hd');if(!hd)return;e.preventDefault();e.stopPropagation();stopP();const el=hd.closest('.cut');drag={si:+el.dataset.si,ci:+el.dataset.ci,x:e.clientX,base:segs.map(g=>({s:g.s,e:g.e,ch:g.ch.map(c=>({s:c.s,e:c.e}))}))};el.setPointerCapture&&el.setPointerCapture(e.pointerId)});
window.addEventListener('pointermove',e=>{if(drag)applyDrag(e.clientX)});
window.addEventListener('pointerup',()=>{if(!drag)return;drag=null;writeTimes();const box=$('src');if(box)box.value=SRC;renderTL()});
async function saveLinePng(){parse();const c=cutAt(cur);if(!c)return out('Select a caption on the timeline first');const[W,H]=dims(2),cv=document.createElement('canvas');cv.width=W;cv.height=H;const cx=cv.getContext('2d');pngShot=true;draw(cx,W,H,c.s+Math.min(.12,(c.e-c.s)/2));pngShot=false;const blob=await new Promise(r=>cv.toBlob(r,'image/png'));out(await save('caption-by-d3m0n-'+W+'x'+H+'.png',blob))}


function bindJoy(){const pad=$('joy'),knob=$('knob');if(!pad||!knob)return;const mv=e=>{const r=pad.getBoundingClientRect();let x=(e.clientX-r.left)/r.width*2-1,y=(e.clientY-r.top)/r.height*2-1,m=Math.hypot(x,y);if(m>1){x/=m;y/=m}S.nx=Math.round(x*40);S.ny=Math.round(y*40);knob.style.left=(50+x*36)+'%';knob.style.top=(50+y*36)+'%';style()};pad.onpointerdown=e=>{pad.setPointerCapture(e.pointerId);mv(e);pad.onpointermove=mv};pad.onpointerup=()=>{pad.onpointermove=null}}
$('full').onclick=()=>{S.simple=S.simple?0:1;$('full').textContent=S.simple?'Full controls':'Simple';paintTools()};
/* init */
$('fv').onchange=()=>{const f=$('fv').files&&$('fv').files[0];$('fv').value='';if(!f)return;if(vidUrl)URL.revokeObjectURL(vidUrl);vidUrl=URL.createObjectURL(f);const v=$('vid');v.src=vidUrl;v.onloadeddata=()=>{S.tr='video';if(v.duration&&isFinite(v.duration))total=Math.max(total,v.duration);struct();msg('Footage ready, '+v.duration.toFixed(1)+'s')};v.load()};
(function(){const p=PRE.cream;IDS.forEach((id,i)=>C[id]=p[1][i]);parse();setPv();renderTL();fonts()})();
