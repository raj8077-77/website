<html lang="hi">

<title>Caption Studio</title>

<style>

:root[data-theme="dark"]{--bg:#0d0d10;--pn:#17171c;--p2:#202027;--ln:#2b2b35;--ink:#f2f2f5;--mu:#8d8d99;--ac:#8b5cf6;--stg:#08080a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

#app{height:100%;display:flex;flex-direction:column}

#top b{font-size:16px}#st{flex:1;font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pri{background:var(--ac);color:#fff;font-weight:800;border-radius:18px;padding:8px 16px}
#stw{flex:1;min-height:0;position:relative;background:var(--stg)}
#pv{position:absolute;inset:0;margin:auto;max-width:100%;max-height:100%;background:#000}
#pv.t{background:repeating-conic-gradient(#888 0 25%,#bbb 0 50%) 0 0/16px 16px}
#bar{flex:none;height:42px;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--pn)}

.imc.on{background:#0e9f6e;color:#fff}

.rw{margin:8px 0}h4{margin:0 0 6px;font-size:12px;color:var(--mu);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}

.hint{font-size:12px;color:var(--mu);line-height:1.5;margin:6px 0}.hint code{background:var(--p2);padding:0 4px;border-radius:4px}

.r2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.r2 input{flex:1;min-width:90px;font-family:monospace}
#cprev{width:38px;height:38px;border-radius:10px;border:1px solid var(--ln);flex:none}
.sw{display:flex;flex-wrap:wrap;gap:7px}.sw i{width:30px;height:30px;border-radius:50%;border:2px solid var(--ln);cursor:pointer}
.th{border:2px solid var(--ln);border-radius:10px;padding:0;margin-right:6px}.th.on{border-color:var(--ac)}
.th canvas,.cvt{width:44px;height:44px;display:block;border-radius:8px;background:repeating-conic-gradient(#999 0 25%,#ccc 0 50%) 0 0/8px 8px}
#pb{height:6px;border-radius:3px;background:var(--p2);overflow:hidden;margin:10px 0}#pb i{display:block;height:100%;width:0;background:var(--ac)}
#exm{font-size:12px;color:var(--mu);line-height:1.5;white-space:pre-wrap;word-break:break-word}
.big{width:100%;padding:13px;border-radius:14px;font-size:15px}
</style>
</head>

function swatches(){const[h,s,v]=hex2hsv(C[tgt]);const hm=[h+180,h+30,h-30,h+120,h-120,h+150,h+210].map(x=>hsv2hex(((x%360)+360)%360,s,v)),sh=[.35,.55,.75,1,1.2].map(k=>hsv2hex(h,Math.min(1,s*(k<1?1+(1-k)*.4:1/k)),Math.min(1,v*k))),ip=[...new Set(imgs.flatMap(m=>m.pal||[]))].slice(0,12),
bs=['#ffffff','#f1efe9','#d9d9d9','#9a9892','#555555','#141414','#000000','#b3001b','#ff3b30','#ff7a45','#ffd23f','#3dffa6','#00c2a8','#4cc9f0','#3a86ff','#8b3dff','#c9a6ff','#ff4d9d'];
const b=(t,a)=>a.length?`<div class="rw"><h4>${t}</h4><div class="sw">${sws(a)}</div></div>`:'';$('sws').innerHTML=b('Isi rang ke shades',sh)+b('Matching (harmony)',hm)+b('Image se',ip)+b('Recent',recent)+b('Basic',bs)}
function cct(){const e=$('cct');if(!e)return;if(S.tr){e.textContent='Transparent mode: padhne ke liye Shadow/Outline lagao.';return}const a=cr(C.c1,C.bg),b=cr(C.cs,C.bg);e.textContent=`Main vs BG ${a.toFixed(1)}:1 ${a>=4.5?'✔':a>=3?'⚠ thoda kamzor':'✖ padhna mushkil'} · Accent vs BG ${b.toFixed(1)}:1 ${b>=3?'✔':'✖ kamzor'}`}
function setC(hex,fromHSV){C[tgt]=hex;if(!fromHSV)hsv=hex2hsv(hex);if($('hex')&&document.activeElement!==$('hex'))$('hex').value=hex;if($('cprev'))$('cprev').style.background=hex;if($('hue')&&!fromHSV)$('hue').value=Math.round(hsv[0]);svDraw();document.querySelectorAll('.chip[data-t] .dot').forEach(d=>d.style.background=C[d.parentNode.dataset.t]);cct();style()}
function pushRecent(){const c=C[tgt];recent=[c,...recent.filter(x=>x!==c)].slice(0,10);swatches()}
const STR=['wc','ak','as'];
function applyPre(k){const p=PRE[k];IDS.forEach((id,i)=>C[id]=p[1][i]);Object.assign(S,p[2],SHP[p[2].sp]||SHP.none);S.pre=k;fonts();struct();sheet()}
function fonts(){Promise.all([FL[S.fm],FL[S.fa]].filter(Boolean).map(f=>document.fonts.load(f))).then(style,style)}
$('tools').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)openTab(b.dataset.tab)});
$('cl').onclick=()=>{tab=null;sheet()};$('exb').onclick=()=>{tab='export';sheet()};
$('sb').addEventListener('input',e=>{const t=e.target,o=t.parentNode.querySelector&&t.parentNode.querySelector('output');
if(t.id==='src'){SRC=t.value;struct()}else if(t.dataset.r){S[t.dataset.r]=+t.value;if(o)o.textContent=t.value;STR.includes(t.dataset.r)?struct():style()}
else if(t.dataset.irk&&imgs[selI]){imgs[selI][t.dataset.irk]=+t.value;if(o)o.textContent=t.value;style()}
else if(t.id==='hue'){hsv[0]=+t.value;setC(hsv2hex(hsv[0],hsv[1],hsv[2]),1)}else if(t.id==='hex'){const v=norm(t.value);if(v&&t.value.length>=6)setC(v)}
else if(t.id==='itg'&&imgs[selI]){const[a,b]=t.value.split(':');imgs[selI].si=+a;imgs[selI].ci=+b;struct()}});
$('sb').addEventListener('click',e=>{const b=e.target.closest('button,i');if(!b)return;const d=b.dataset;
if(d.s){const n=Number(d.v);S[d.s]=isNaN(n)?d.v:n;b.parentNode.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));if(d.s==='fm'||d.s==='fa')fonts();if(d.s==='tr'){setPv();cct()}STR.includes(d.s)?struct():style();if(tab==='export')$('go').textContent='⬇ Export '+dims(S.rs).join('×')}
else if(d.ik&&imgs[selI]){imgs[selI][d.ik]=d.v;b.parentNode.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));struct()}
else if(d.p)applyPre(d.p);else if(d.sp){Object.assign(S,SHP[d.sp]);sheet();style()}
else if(d.go){tgt=d.go;tab='color';sheet()}else if(d.t){tgt=d.t;sheet()}
else if(d.c){setC(d.c);pushRecent()}
else if(d.i!==undefined){selI=+d.i;sheet();renderTL()}
else if(d.a==='eye')new EyeDropper().open().then(r=>{setC(r.sRGBHex);pushRecent()}).catch(()=>{})
else if(d.a==='ac'){tgt='c1';const w=lum('#ffffff')>0?cr('#ffffff',C.bg):0,k=cr('#000000',C.bg);C.c1=w>k?'#ffffff':'#000000';sheet();style()}
else if(d.a==='addCut'||d.a==='addLine'){const c=cutAt(cur);if(!c)return;pend={si:c.si,ci:d.a==='addCut'?c.ci:-1};$('fi').click()}
else if(d.a==='addLink'){const u=prompt('Image link (https://...png). Hosted page mein bahari links block hote hain; apni website/local file par chalega.');if(!u)return;const c=cutAt(cur);pend={si:c?c.si:0,ci:c?c.ci:-1};const im=new Image();im.crossOrigin='anonymous';im.onload=async()=>{try{addImg(await createImageBitmap(im),u.split('/').pop())}catch(x){msg('Is link ki image export ke liye safe nahi. Upload karo.')}};im.onerror=()=>msg('Link load nahi hua. Gallery se upload karo.');im.src=u}
else if(d.a==='del'&&imgs[selI]){imgs.splice(selI,1);selI=imgs.length-1;sheet();struct()}});
/* export */
async function save(name,data){try{const d=window.claude&&await claude.use('downloads');if(d){await d.save({filename:name,data});return'Saved ✔'}}catch(e){if(e&&e.code==='declined')return'Cancelled'}
const a=document.createElement('a');a.href=URL.createObjectURL(data);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},5000);return'Download shuru ✔'}
const bar=p=>{const i=document.querySelector('#pb i');if(i)i.style.width=p*100+'%'},out=t=>{const e=$('exm');if(e)e.textContent=t;msg(t.split('\n')[0])};
async function runExport(){const b=$('go');b.disabled=true;try{parse();if(!total)throw new Error('Timestamp wali line nahi mili');stopP();S.fmt==='zip'?await expZip():await expWebM()}catch(e){out('Error: '+(e&&e.name?e.name+' — ':'')+(e&&e.message||e)+'\n\nTip: 4K mein dikkat ho to 1080p/2K try karo ya PNG frames ZIP chuno.')}b&&(b.disabled=false)}
async function expWebM(){const[W,H]=dims(S.rs),fps=S.fp,cv=document.createElement('canvas');cv.width=W;cv.height=H;const cx=cv.getContext('2d');if(!window.MediaRecorder)throw new Error('Is browser mein MediaRecorder nahi hai, PNG ZIP use karo');
let rec,err;const parts=[];outer:for(const mt of['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].filter(m=>MediaRecorder.isTypeSupported(m)))for(const bps of[Math.min(8e7,W*H*fps*.12),Math.min(2.5e7,W*H*fps*.06),0]){try{const o={mimeType:mt};if(bps)o.videoBitsPerSecond=bps;rec=new MediaRecorder(cv.captureStream(fps),o);break outer}catch(e){err=e;rec=null}}
if(!rec)throw err||new Error('Recorder start nahi hua');rec.ondataavailable=e=>e.data&&e.data.size&&parts.push(e.data);let rerr=null;rec.onerror=e=>rerr=e.error||new Error('Recorder error');
const done=new Promise(r=>rec.onstop=r);draw(cx,W,H,0);rec.start(1000);const s=performance.now();
await new Promise(res=>{const f=n=>{const t=(n-s)/1000;draw(cx,W,H,Math.min(t,total));bar(Math.min(1,t/total));out('Recording '+t.toFixed(1)+' / '+total.toFixed(1)+'s (tab khula rakho)');if(t<total+.2&&!rerr)requestAnimationFrame(f);else res()};requestAnimationFrame(f)});
if(rec.state!=='inactive')rec.stop();await done;if(rerr)throw rerr;const blob=new Blob(parts,{type:'video/webm'});if(!blob.size)throw new Error('Khaali video bani (browser ne 4K recording reject ki). Chhota size try karo.');
out(await save('captions-'+W+'x'+H+'.webm',blob))}
const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc=u=>{let c=~0;for(let i=0;i<u.length;i++)c=crcT[(c^u[i])&255]^(c>>>8);return~c>>>0};
function zip(F){const enc=new TextEncoder(),P=[],Cd=[];let off=0;F.forEach(f=>{const nm=enc.encode(f.n),h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint32(14,f.crc,true);h.setUint32(18,f.size,true);h.setUint32(22,f.size,true);h.setUint16(26,nm.length,true);P.push(h.buffer,nm,f.b);
const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint32(16,f.crc,true);c.setUint32(20,f.size,true);c.setUint32(24,f.size,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);Cd.push(c.buffer,nm);off+=30+nm.length+f.size});
const cl=Cd.reduce((a,b)=>a+b.byteLength,0),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,F.length,true);e.setUint16(10,F.length,true);e.setUint32(12,cl,true);e.setUint32(16,off,true);return new Blob([...P,...Cd,e.buffer],{type:'application/zip'})}
async function expZip(){const[W,H]=dims(S.rs),fps=S.fp,cv=document.createElement('canvas');cv.width=W;cv.height=H;const cx=cv.getContext('2d'),N=Math.ceil(total*fps),F=[];
for(let i=0;i<N;i++){draw(cx,W,H,i/fps);const b=await new Promise((r,j)=>cv.toBlob(x=>x?r(x):j(new Error('Frame encode fail (memory kam?)')),'image/png')),u=new Uint8Array(await b.arrayBuffer());F.push({n:'f'+String(i+1).padStart(5,'0')+'.png',b,size:b.size,crc:crc(u)});if(i%4===0){bar(i/N);out('Frame '+(i+1)+' / '+N);await new Promise(r=>setTimeout(r))}}
out('ZIP ban raha hai...');bar(1);out(await save('captions-'+W+'x'+H+'-'+fps+'fps.zip',zip(F)))}
/* init */
(function(){const p=PRE.cream;IDS.forEach((id,i)=>C[id]=p[1][i]);parse();setPv();renderTL();fonts()})();
